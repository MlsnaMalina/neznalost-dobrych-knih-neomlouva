<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Neznalost dobrých knih neomlouvá</title>
  <!-- Cormorant Garamond pro knižní/právní text + JetBrains Mono pro UI prvky.
       Kontrast staré právní × nové technologické. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="light">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">§</span>
      <span class="brand-name">Neznalost dobrých knih neomlouvá</span>
    </div>
    <div class="top-actions">
      <button id="soundToggle" class="icon-btn" type="button" aria-label="Přepnout zvuk">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
             data-icon="off">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <line x1="17" y1="9" x2="22" y2="14"/>
          <line x1="22" y1="9" x2="17" y2="14"/>
        </svg>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
             data-icon="on" style="display:none;">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path d="M16 8c1.5 1 2.5 2.5 2.5 4S17.5 15 16 16"/>
          <path d="M19 5c2.5 1.8 4 4.2 4 7s-1.5 5.2-4 7"/>
        </svg>
      </button>
      <button id="themeToggle" class="ghost-btn" type="button" aria-label="Přepnout režim">
        <span data-theme-label>Noční služba</span>
      </button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <span>Konferenční hříčka · v0.1</span>
  </footer>

  <script src="js/books.js"></script>
  <script src="js/maxims.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/alphabet.js"></script>
  <script src="js/titleGuess.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/penalty.js"></script>
  <script src="js/result.js"></script>
  <script src="js/startScreen.js"></script>
  <script src="js/gameScreen.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
